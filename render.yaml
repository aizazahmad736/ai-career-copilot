databases:
  - name: career-copilot-db
    databaseName: career_copilot
    user: career_copilot

services:
  - type: web
    name: career-copilot-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: career-copilot-db
          property: connectionString
      - key: AUTH_REQUIRED
        value: "true"
      - key: AUTH_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: '["https://YOUR_APP.vercel.app"]'
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash